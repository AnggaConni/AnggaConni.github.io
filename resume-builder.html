<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume Builder | Angga Conni Saputra</title><link rel="icon" href="favicon.png"><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f6;color:#172033;font:10pt Arial,sans-serif}.bar{position:sticky;top:0;background:#101827;color:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:5}.btn{padding:10px 14px;border:0;border-radius:8px;background:#263449;color:white;font-weight:bold;cursor:pointer}.gold{background:#d9ac2b;color:#111}.sheet{width:210mm;min-height:297mm;margin:24px auto;background:white;padding:16mm 18mm;box-shadow:0 8px 28px #0001;line-height:1.4}.sheet header{border-bottom:3px solid var(--accent,#2458a6);padding-bottom:12px}.sheet h1{font-size:25pt;margin:0 0 6px}.headline{color:var(--accent,#2458a6);font-weight:bold;margin-bottom:7px}.contact{color:#64748b;font-size:8.5pt;overflow-wrap:anywhere}.sheet h2{font-size:11pt;color:var(--accent,#2458a6);border-bottom:1px solid #dbe1ea;padding-bottom:4px;margin:15px 0 8px;text-transform:uppercase;letter-spacing:.06em}.job{margin-bottom:11px;break-inside:avoid}.top{display:flex;justify-content:space-between;gap:10px}.job h3{margin:0;font-size:10pt}.period{color:#64748b;white-space:nowrap;font-size:8.5pt}.job p{margin:4px 0}.job ul{padding-left:18px;margin:5px 0}.job li{margin-bottom:3px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{border:1px solid #dbe1ea;border-radius:4px;padding:3px 6px;font-size:8pt}.edu,.project{margin-bottom:7px}.project a{display:inline-block;overflow-wrap:anywhere;color:var(--accent,#2458a6);text-decoration:underline;text-underline-offset:2px}.project .project-link{font-size:8.5pt;margin-top:2px}.project{break-inside:avoid}.backdrop{position:fixed;inset:0;background:#101827e8;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{background:white;border-radius:16px;padding:26px;width:min(700px,100%);max-height:92vh;overflow:auto}.modal h2{margin:0 0 8px}.modal p{color:#64748b}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{background:white;border:1px solid #dbe1ea;border-radius:10px;padding:14px;text-align:left;cursor:pointer}.opt.selected,.opt:hover{border-color:#2458a6;background:#f1f6ff}.opt strong,.opt span{display:block}.opt span{font-size:12px;color:#64748b;margin-top:4px}.foot{display:flex;justify-content:flex-end;margin-top:16px}.status{font-size:12px;color:#64748b;margin-top:10px}@media(max-width:850px){.sheet{width:100%;margin:10px auto;padding:24px}.options{grid-template-columns:1fr}.bar{gap:10px;flex-wrap:wrap}}@page{size:A4;margin:8mm 0 10mm}@media print{body{background:white}.bar,.backdrop{display:none!important}.sheet{width:210mm;min-height:279mm;margin:0;padding:10mm 17mm 18mm;box-shadow:none;page-break-after:always}.sheet:last-child{page-break-after:auto}.job,.edu,.project{break-inside:avoid}.sheet h2{margin-top:18px;margin-bottom:10px}.project{margin-bottom:10px;line-height:1.5}.project .project-link{margin-top:3px}}
</style></head><body>
<div class="bar"><div><b>Resume Builder</b><div style="font-size:12px;color:#cbd5e1">Tailored from portfolio JSON</div></div><div><button class="btn" id="change">Change profile</button> <button class="btn gold" id="print">Print / Save PDF</button></div></div>
<main class="sheet" id="resume">Loading data…</main>
<div class="backdrop" id="backdrop"><div class="modal"><h2>Choose your resume focus</h2><p>Select the role profile matching the vacancy. The resume will adjust its summary, selected experience and emphasis.</p><div class="options" id="options"></div><div class="foot"><button class="btn gold" id="build">Build resume</button></div><div class="status" id="status">Loading profile and experience datasets…</div></div></div>
<script>
const D={};const THEMES=[
{id:"mel",name:"MEL Officer",desc:"Monitoring, evaluation, learning, results and evidence.",keys:["monitoring","evaluation","learning","MEL","research","RBM","data","capacity building"],summary:["behavioural-policy-delivery"]},
{id:"digital",name:"Digital Transformation Officer",desc:"Digital systems, GovTech, AI tools, adoption and data governance.",keys:["digital transformation","AI & Data Systems","Technology Architecture","systems architecture","digital","AI","workflow","data"],summary:["policy-tech-architecture"]},
{id:"coord",name:"Project Coordination",desc:"Project delivery, partners, operations, events and institutional collaboration.",keys:["Diplomacy & Partnerships","Operations & Administration","Capacity Building","coordination","partnership","workshop","project"],summary:["executive-profile"]},
{id:"social",name:"Social Change & Behavioural Insights",desc:"Behaviour change, community engagement and capacity building.",keys:["Behavioural Science","Education Innovation","Climate & Coastal Resilience","behaviour change","community","COM-B"],summary:["behavioural-policy-delivery"]},
{id:"policy",name:"Data / Policy Analyst",desc:"Policy analysis, strategic intelligence, data and governance.",keys:["Policy & Governance","AI & Data Systems","Rural Development","foresight","policy","data","research","governance"],summary:["foresight-strategic-intelligence","policy-tech-architecture"]},
{id:"foresight",name:"Strategic Foresight & OSINT",desc:"Horizon scanning, weak signals, risk and emerging opportunities.",keys:["Policy & Governance","AI & Data Systems","Technology Architecture","foresight","horizon scanning","OSINT","signals"],summary:["foresight-strategic-intelligence"]}
];let selected="digital";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const arr=v=>Array.isArray(v)?v:[];
async function load(){const m=await fetch("data/manifest.json").then(r=>r.json());await Promise.all(Object.keys(m.datasets).map(async k=>{const r=await fetch(m.datasets[k]);if(!r.ok)throw Error("Unable to load "+m.datasets[k]);D[k]=await r.json()}))}
function choose(){document.getElementById("options").innerHTML=THEMES.map(t=>'<button class="opt '+(t.id===selected?'selected':'')+'" data-theme="'+t.id+'"><strong>'+esc(t.name)+'</strong><span>'+esc(t.desc)+'</span></button>').join("");document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{selected=b.dataset.theme;choose()});document.getElementById("backdrop").style.display="flex"}
function score(e,t){const s=[e.role,e.organisation,e.overview,...arr(e.themes),...arr(e.competencies),...arr(e.highlights).flatMap(h=>[h.area,h.detail,...arr(h.themes),...arr(h.filters)])].join(" ").toLowerCase();return t.keys.reduce((n,k)=>n+(s.includes(k.toLowerCase())?1:0),0)}
function render(){const t=THEMES.find(x=>x.id===selected),p=D.profile;const ex=arr(D.experience.experiences).map(e=>({...e,score:score(e,t)})).sort((a,b)=>b.score-a.score).filter(e=>e.score>0).slice(0,4);const sum=arr(p.summaries).filter(s=>t.summary.includes(s.id)).map(s=>s.text).join(" ")||p.summary;const skills=[...new Set([...t.keys,...arr(D.competencies.competencies).filter(c=>(c.title+" "+c.description+" "+arr(c.tags).join(" ")).toLowerCase().includes(t.keys[0].toLowerCase())).map(c=>c.title)])].slice(0,14);
const jobs=ex.map(e=>'<article class="job"><div class="top"><div><h3>'+esc(e.role)+'</h3><b>'+esc(e.organisation)+'</b></div><span class="period">'+esc(e.period?.label||"")+'</span></div><p>'+esc(e.overview||"")+'</p><ul>'+arr(e.highlights).slice(0,3).map(h=>'<li>'+esc(h.detail||h.area)+'</li>').join("")+'</ul></article>').join("");
const edu=arr(D.education.education).map(e=>'<div class="edu"><b>'+esc(e.degree)+'</b><div>'+esc(e.institution)+' · '+esc(e.period?.label||"")+(e.gpa?' · GPA '+esc(e.gpa.value)+'/'+esc(e.gpa.scale):"")+'</div></div>').join("");
const appKeywords={mel:["MEL","monitoring","evaluation","dashboard","reporting","data","impact","Theory of Change"],digital:["AI","digital","system","workflow","OCR","automation","GIS","data"],coord:["project","coordination","travel","reporting","event","workflow","stakeholder"],social:["education","learning","behaviour","community","coastal","heritage","capacity"],policy:["policy","data","analysis","governance","research","foresight","intelligence"],foresight:["foresight","radar","OSINT","horizon","intelligence","signals","risk"]};const terms=appKeywords[t.id]||t.keys;const apps=arr(D.applications.applications).map(a=>({...a,_score:terms.reduce((n,k)=>n+(([a.title,a.description,...arr(a.tags),a.category].join(" ").toLowerCase().includes(k.toLowerCase()))?1:0),0)})).filter(a=>a._score>0).sort((a,b)=>b._score-a._score).slice(0,5).map(a=>'<div class="project"><b>'+esc(a.title)+'</b> — '+esc(a.description)+arr(a.links).map(l=>'<div class="project-link"><a href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">'+esc(l.url)+'</a></div>').join("")+"</div>").join("");
const links=arr(p.links).filter(l=>["linkedin","github","contact","website"].includes(l.id)).map(l=>esc(l.label)+": "+esc(l.url)).join(" · ");const colors={mel:"#0f766e",digital:"#2458a6",coord:"#7c3aed",social:"#b45309",policy:"#1d4ed8",foresight:"#0f766e"};document.documentElement.style.setProperty("--accent",colors[t.id]);
document.getElementById("resume").innerHTML='<header><h1>'+esc(p.name)+'</h1><div class="headline">'+esc(t.name)+' | '+esc(p.headline)+'</div><div class="contact">Jakarta, Indonesia · '+links+'</div><p>'+esc(sum)+'</p></header><h2>Professional Experience</h2>'+jobs+'<h2>Core Competencies</h2><div class="chips">'+skills.map(s=>'<span class="chip">'+esc(s)+'</span>').join("")+'</div><h2>Education</h2>'+edu+(apps?'<h2>Selected Digital Products</h2>'+apps:"");document.title=t.name+" Resume | "+p.name}
document.getElementById("build").onclick=()=>{document.getElementById("backdrop").style.display="none";render()};document.getElementById("change").onclick=choose;document.getElementById("print").onclick=()=>window.print();
(async()=>{choose();try{await load();document.getElementById("status").textContent="Data loaded. Select a focus and build your resume.";choose()}catch(e){document.getElementById("status").textContent=e.message;console.error(e)}})();
</script></body></html>
